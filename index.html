<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>SASP CVE Inspection Report Generator</title>
<style>
:root{
  --navy:#14213d; --steel:#3a5a8c; --paper:#fdfdfb; --ink:#1a1a1a; --line:#c9c5ba;
  --bg:#e7e4dc; --accent:#8a1f21; --panel:#ffffff;
}
*{box-sizing:border-box;}
html,body{margin:0;padding:0;background:var(--bg);color:var(--ink);font-family:'Georgia','Times New Roman',serif;}
body{padding:20px;padding-top:calc(20px + env(safe-area-inset-top,0px));padding-bottom:calc(20px + env(safe-area-inset-bottom,0px));}
h1{font-size:1.4rem;color:var(--navy);margin:0 0 4px;}
.sub{color:#555;font-size:.85rem;margin-bottom:18px;font-family:Arial,sans-serif;}
.wrap{display:grid;grid-template-columns:1fr;gap:20px;max-width:1500px;margin:0 auto;}
@media(min-width:1100px){.wrap{grid-template-columns:420px 1fr;}}
.panel{background:var(--panel);border:1px solid var(--line);border-radius:6px;padding:16px;font-family:Arial,sans-serif;}
.panel h2{font-size:.95rem;text-transform:uppercase;letter-spacing:.03em;color:var(--navy);border-bottom:2px solid var(--navy);padding-bottom:6px;margin:0 0 10px;}
fieldset{border:1px solid var(--line);border-radius:4px;margin:0 0 12px;padding:10px;}
legend{font-size:.75rem;color:var(--steel);padding:0 6px;font-weight:bold;}
label{display:block;font-size:.72rem;color:#444;margin-top:6px;}
html{color-scheme:light;}
input,select,textarea{width:100%;padding:5px 6px;font-size:.82rem;border:1px solid #b8b4a9;border-radius:3px;margin-top:2px;font-family:Arial,sans-serif;background:#fff;color:#111;}
select option{color:#111;background:#fff;}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:8px;}
.row3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px;}
button{cursor:pointer;border:none;border-radius:4px;padding:8px 14px;font-size:.82rem;font-weight:bold;font-family:Arial,sans-serif;}
.btn-add{background:var(--steel);color:#fff;width:100%;margin-top:6px;}
.btn-print{background:var(--accent);color:#fff;width:100%;margin-top:14px;padding:11px;font-size:.95rem;}
.btn-rm{background:#c94040;color:#fff;padding:4px 8px;font-size:.7rem;}
.vio-card{border:1px solid var(--line);border-radius:4px;padding:8px;margin-bottom:8px;background:#fafaf7;}
.vio-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:4px;}
.vio-head span{font-size:.72rem;font-weight:bold;color:var(--navy);}

/* ---- report ---- */
#report{background:var(--paper);padding:34px 38px;border:1px solid #999;box-shadow:0 2px 10px rgba(0,0,0,.15);font-family:Arial,Helvetica,sans-serif;font-size:12.5px;color:#111;line-height:1.35;min-height:400px;}
.rpt-top{display:flex;justify-content:space-between;border-bottom:2px solid #111;padding-bottom:6px;}
.rpt-title{font-weight:bold;font-size:15px;}
.rpt-hdr{display:flex;gap:12px;margin:8px 0 10px;}
.badge{width:52px;height:auto;flex-shrink:0;}
.badge img{width:100%;display:block;}

.agency{font-size:11.5px;}
.agency b{font-size:12.5px;}
.metabox{margin-left:auto;text-align:right;font-size:11.5px;}
.section-title{font-weight:bold;border-bottom:1px solid #111;margin:10px 0 4px;font-size:12.5px;}
table{width:100%;border-collapse:collapse;margin-top:2px;}
td,th{padding:1.5px 4px;font-size:11.5px;vertical-align:top;text-align:left;}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:0 20px;}
.vio-table th{border-bottom:1px solid #111;}
.vio-table td{border-bottom:1px dotted #bbb;}
.oosY{font-weight:bold;color:#8a1f21;}
.footer-note{font-size:10.5px;margin-top:14px;color:#222;}
.sigline{border-top:1px solid #111;margin-top:4px;width:260px;display:inline-block;}
@media print{
  body{background:#fff;padding:0;}
  .no-print,h1,.sub{display:none;}
  .wrap{display:block;}
  #report{box-shadow:none;border:none;}
}
</style>
</head>
<body>
<h1>San Andreas State Police — Commercial Vehicle Enforcement</h1>
<div class="sub">Driver/Vehicle Examination Report generator — fill in the fields, add violations, then print or save as PDF.</div>
<div class="wrap">

<div class="panel no-print">
<h2>Report Details</h2>
<div class="row2">
  <div><label>Report # <span style="font-weight:normal;color:#888;">(auto)</span></label>
    <div style="display:flex;gap:4px;">
      <input id="reportNum" readonly style="background:#f0efe9;">
      <button type="button" onclick="newReportNumber()" style="background:var(--steel);color:#fff;padding:5px 8px;">↻</button>
    </div>
  </div>
  <div><label>Inspection Date <span style="font-weight:normal;color:#888;">(auto, EST)</span></label><input id="inspDate" type="date"></div>
</div>
<div class="row3">
  <div><label>Start Time</label><input id="startTime" type="time"></div>
  <div><label>End Time</label><input id="endTime" type="time"></div>
  <div><label>Level</label><select id="level"><option>I - Full</option><option selected>II - Walk-Around</option><option>III - Driver Only</option><option>V - Vehicle Only</option></select></div>
</div>
<div class="row2">
  <div><label>Location</label><input id="location" placeholder="E-PALETO WEIGH STATION"></div>
  <div><label>Highway</label><input id="highway" placeholder="RTE 1 SB"></div>
</div>
<div class="row2">
  <div><label>County</label><input id="county" placeholder="BLAINE"></div>
  <div><label>HM Inspection Type</label><input id="hmType" value="None"></div>
</div>

<h2 style="margin-top:16px;">Carrier &amp; Driver</h2>
<label>Carrier Name</label><input id="carrier">
<div class="row2">
  <div><label>DBA / Address</label><input id="carrierAddr"></div>
  <div><label>USDOT #</label><input id="usdot"></div>
</div>
<div class="row2">
  <div><label>Phone</label><input id="carrierPhone"></div>
  <div><label>Email</label><input id="carrierEmail"></div>
</div>
<label>Driver Name</label><input id="driver">
<div class="row2">
  <div><label>License #</label><input id="license"></div>
  <div><label>State</label><input id="licState" value="SA" maxlength="4"></div>
</div>
<div class="row2">
  <div><label>Origin</label><input id="origin"></div>
  <div><label>Destination</label><input id="destination"></div>
</div>
<label>Cargo</label><input id="cargo" placeholder="EMPTY">

<h2 style="margin-top:16px;">Vehicle Units</h2>
<fieldset><legend>Unit 1</legend>
<div class="row3">
  <div><label>Type</label>
    <select id="u1type">
      <option value="">— Select —</option>
      <option value="TR">TR – Truck Tractor</option>
      <option value="TK">TK – Straight Truck</option>
      <option value="ST">ST – Semi-Trailer</option>
      <option value="FT">FT – Full Trailer</option>
      <option value="DL">DL – Converter Dolly</option>
      <option value="BUS">BUS – Bus</option>
      <option value="MC">MC – Motorcoach</option>
      <option value="PT">PT – Pole Trailer</option>
      <option value="PC">PC – Passenger Car</option>
      <option value="MH">MH – Motorhome</option>
    </select>
  </div>
  <div><label>Make</label>
    <select id="u1makeSel" onchange="toggleCustomMake(1)">
      <option value="">— Select —</option>
      <option>Peterbilt</option>
      <option>Kenworth</option>
      <option>Western Star</option>
      <option>Ford</option>
      <option>Chevy</option>
      <option>GMC</option>
      <option>BRUTE</option>
      <option value="Custom">Custom…</option>
    </select>
    <input id="u1makeCustom" placeholder="Enter make" style="display:none;margin-top:4px;">
  </div>
  <div><label>Year</label><input id="u1year"></div>
</div>
<div class="row2">
  <div><label>Plate</label><input id="u1plate"></div>
  <div><label>VIN</label><input id="u1vin"></div>
</div>
<label>GVWR</label><input id="u1gvwr">
</fieldset>
<fieldset><legend>Unit 2 (trailer, optional)</legend>
<div class="row3">
  <div><label>Type</label>
    <select id="u2type">
      <option value="">— Select —</option>
      <option value="TR">TR – Truck Tractor</option>
      <option value="TK">TK – Straight Truck</option>
      <option value="ST" selected>ST – Semi-Trailer</option>
      <option value="FT">FT – Full Trailer</option>
      <option value="DL">DL – Converter Dolly</option>
      <option value="BUS">BUS – Bus</option>
      <option value="MC">MC – Motorcoach</option>
      <option value="PT">PT – Pole Trailer</option>
      <option value="PC">PC – Passenger Car</option>
      <option value="MH">MH – Motorhome</option>
    </select>
  </div>
  <div><label>Make</label>
    <select id="u2makeSel" onchange="toggleCustomMake(2)">
      <option value="">— Select —</option>
      <option>Peterbilt</option>
      <option>Kenworth</option>
      <option>Western Star</option>
      <option>Ford</option>
      <option>Chevy</option>
      <option>GMC</option>
      <option>BRUTE</option>
      <option value="Custom">Custom…</option>
    </select>
    <input id="u2makeCustom" placeholder="Enter make" style="display:none;margin-top:4px;">
  </div>
  <div><label>Year</label><input id="u2year"></div>
</div>
<div class="row2">
  <div><label>Plate</label><input id="u2plate"></div>
  <div><label>VIN</label><input id="u2vin"></div>
</div>
<label>GVWR</label><input id="u2gvwr">
</fieldset>

<h2 style="margin-top:16px;">Violations</h2>
<div id="vioList"></div>
<button class="btn-add" onclick="addViolation()">+ Add Violation</button>

<h2 style="margin-top:16px;">Notes</h2>
<label>Alcohol/Controlled Substance Check</label>
<select id="altCheck"><option>No</option><option>Yes</option></select>
<label>State Information / Remarks</label>
<textarea id="stateInfo" rows="3" placeholder="2 AXLE DUMP W/ TAG; # Vehicles Observed: 2..."></textarea>
<label>Inspecting Trooper</label><input id="trooper">
<label>Badge #</label><input id="badge">

<button class="btn-print" onclick="render()">Generate / Refresh Report ↓</button>
<button class="btn-print" style="background:var(--navy);margin-top:8px;" onclick="window.print()">Print / Save as PDF</button>
</div>

<div class="panel" style="padding:0;background:transparent;border:none;">
<div id="report"></div>
</div>
</div>

<script>
// Real FMCSA / CVSA out-of-service criteria violation codes (49 CFR), as used on
// actual Massachusetts State Police CVE inspection reports.
const VIO_GROUPS = {
"Brakes": {
  "393.47(a)":"Brakes out of adjustment beyond allowable limits",
  "393.48(a)":"Inoperative or defective brake on required axle",
  "393.42":"Required service brakes not provided on all wheels",
  "393.43(d)":"Missing or inoperable breakaway braking system on trailer/converter dolly",
  "393.53(b)":"Antilock braking system (ABS) malfunction indicator inoperative"
},
"Lighting & Electrical": {
  "393.9":"Inoperative required lamp (head/tail/stop/turn signal)",
  "393.11":"Required lamp or reflector not mounted as required",
  "393.28":"Wiring not properly insulated or protected"
},
"Tires & Wheels": {
  "393.75(a)":"Tire flat or has an audible leak",
  "393.75(b)":"Tire tread depth below minimum (steer <4/32\", other axles <2/32\")",
  "393.75(c)":"Tire has cut/bulge exposing ply or belt material",
  "393.75(h)":"Tire sizes/types mismatched on same axle",
  "393.205":"Wheel with loose, missing, or damaged fasteners"
},
"Emergency Equipment": {
  "393.95(a)(1)":"No fire extinguisher present or not properly rated/charged",
  "393.95(f)":"Warning devices (triangles/flares) missing or improper"
},
"Steering & Suspension": {
  "393.209":"Steering system has excessive lash/play",
  "393.207":"Suspension defect - broken spring, shifted axle, or missing U-bolt"
},
"Coupling Devices": {
  "393.70(b)":"Fifth wheel not properly secured or mounted",
  "393.71":"Safety chains/devices missing or inadequate on towed unit"
},
"Vehicle Identification": {
  "390.21(b)(1)":"CMV does not display legal/trade name and USDOT number on both sides",
  "393.19":"Required slow-moving-vehicle marking missing"
},
"Driver Qualification": {
  "391.11(b)(4)":"Driver not in possession of a valid, properly endorsed CDL",
  "391.41(a)":"Driver not medically qualified / no current medical certificate",
  "391.15":"Driver operating a CMV while disqualified"
},
"Hours of Service": {
  "395.8(a)":"Driver failed to maintain a Record of Duty Status (log)",
  "395.3(a)(2)":"Driver exceeded 11-hour driving limit",
  "395.3(a)(3)(i)":"Driver exceeded 14-hour on-duty window",
  "395.8(e)":"False report of driver's record of duty status"
},
"Inspection & Maintenance": {
  "396.3(a)(1)":"Failure to correct out-of-service defect noted on a prior inspection",
  "396.17(a)":"No periodic (annual) inspection performed within required interval",
  "396.13":"Driver failed to perform a pre-trip inspection"
},
"Cargo & Hazmat": {
  "392.9(a)":"Cargo not properly secured / load securement violation",
  "397.19":"Hazardous materials placarding violation"
},
"Driving / Other": {
  "392.2":"Speeding - exceeded posted limit",
  "392.16":"Failure to use seat belt while operating CMV",
  "392.14":"Failure to use caution/reduce speed for hazardous road conditions"
}
};
const VIO_FLAT = {};
Object.entries(VIO_GROUPS).forEach(([g,items])=>{
  Object.entries(items).forEach(([code,desc])=>{ VIO_FLAT[code] = {desc,group:g}; });
});
VIO_FLAT["CUSTOM"] = {desc:"", group:"Other"};
const FIRST_CODE = Object.keys(VIO_FLAT)[0];

let violations = [];

function randomReportNumber(){
  const n = Math.floor(Math.random()*99999999)+1;
  return "SADV" + String(n).padStart(8,"0");
}
function newReportNumber(){
  document.getElementById('reportNum').value = randomReportNumber();
}
function setTodayEST(){
  const parts = new Intl.DateTimeFormat('en-CA',{timeZone:'America/New_York',year:'numeric',month:'2-digit',day:'2-digit'}).format(new Date());
  document.getElementById('inspDate').value = parts; // en-CA gives YYYY-MM-DD
}

function addViolation(){
  violations.push({code:FIRST_CODE, unit:"1", oos:"N", type:"F", desc:VIO_FLAT[FIRST_CODE].desc});
  drawVioForm();
}
function removeViolation(i){ violations.splice(i,1); drawVioForm(); }

function optionsHtml(selectedCode){
  let html = Object.entries(VIO_GROUPS).map(([g,items])=>
    `<optgroup label="${g}">${Object.entries(items).map(([code,desc])=>
      `<option value="${code}" ${code===selectedCode?'selected':''}>${code} — ${desc}</option>`
    ).join('')}</optgroup>`
  ).join('');
  html += `<option value="CUSTOM" ${selectedCode==='CUSTOM'?'selected':''}>CUSTOM — write your own description below</option>`;
  return html;
}

function drawVioForm(){
  const el = document.getElementById('vioList');
  el.innerHTML = violations.map((v,i)=>`
    <div class="vio-card">
      <div class="vio-head"><span>Violation ${i+1}</span><button class="btn-rm" onclick="removeViolation(${i})">Remove</button></div>
      <label>Violation Code</label>
      <select onchange="updateVio(${i},'code',this.value)">
        ${optionsHtml(v.code)}
      </select>
      <div class="row3">
        <div><label>Unit</label><select onchange="updateVio(${i},'unit',this.value)"><option ${v.unit=='1'?'selected':''}>1</option><option ${v.unit=='2'?'selected':''}>2</option></select></div>
        <div><label>Type</label><select onchange="updateVio(${i},'type',this.value)"><option ${v.type=='F'?'selected':''}>F</option><option ${v.type=='W'?'selected':''}>W</option></select></div>
        <div><label>OOS</label><select onchange="updateVio(${i},'oos',this.value)"><option ${v.oos=='N'?'selected':''}>N</option><option ${v.oos=='Y'?'selected':''}>Y</option></select></div>
      </div>
      <label>Description</label>
      <textarea rows="2" oninput="updateVio(${i},'desc',this.value)">${v.desc}</textarea>
    </div>`).join('');
}
function updateVio(i,field,val){
  violations[i][field]=val;
  if(field==='code') violations[i].desc = VIO_FLAT[val] ? VIO_FLAT[val].desc : '';
  if(field==='desc') return;
  drawVioForm();
}

function esc(s){ return (s||'').toString(); }

function toggleCustomMake(unit){
  const sel = document.getElementById('u'+unit+'makeSel');
  const custom = document.getElementById('u'+unit+'makeCustom');
  if(sel.value === 'Custom'){
    custom.style.display = 'block';
  } else {
    custom.style.display = 'none';
    custom.value = '';
  }
}
function getMake(unit){
  const sel = document.getElementById('u'+unit+'makeSel');
  if(sel.value === 'Custom') return esc(document.getElementById('u'+unit+'makeCustom').value);
  return esc(sel.value);
}

function fmtTime(t){
  if(!t) return '';
  const [hStr,mStr] = t.split(':');
  let h = parseInt(hStr,10);
  const m = mStr;
  const ampm = h >= 12 ? 'PM' : 'AM';
  h = h % 12;
  if(h === 0) h = 12;
  return `${h}:${m} ${ampm}`;
}

function render(){
  const v = id=>esc(document.getElementById(id).value);
  const oosCount = violations.filter(x=>x.oos==='Y').length;
  const html = `
  <div class="rpt-top">
    <div class="rpt-title">DRIVER/VEHICLE EXAMINATION REPORT</div>
    <div style="font-size:11px;">Inspect ${Math.floor(Math.random()*9)+1}.${Math.floor(Math.random()*900+100)}.${Math.floor(Math.random()*9000+1000)}</div>
  </div>
